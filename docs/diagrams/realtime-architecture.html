<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatApp · Flujo realtime de mensajes</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>ChatApp · Flujo realtime de mensajes</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="realtime-flow-title realtime-flow-desc">
        <title id="realtime-flow-title">ChatApp · Flujo realtime de mensajes</title>
        <desc id="realtime-flow-desc">Ciclo de datos en vivo: la UI escribe mensajes mediante server actions, la tabla messages los persiste, Supabase Realtime retransmite los cambios por websocket y el hook useMessagesRealtime los fusiona de vuelta en la interfaz.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ===== ZONES (painted first) ===== -->
        <rect x="40" y="104" width="576" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="44" y="108" width="116" height="12" rx="2" fill="#f5f5f5"/>
        <text x="102" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">APLICACIÓN · NEXT.JS</text>

        <rect x="648" y="104" width="272" height="368" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="652" y="108" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="678" y="117" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SUPABASE</text>

        <!-- ===== ARROWS (before nodes) ===== -->
        <!-- 1 · UI → server actions -->
        <path d="M 288,168 H 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 2 · actions → tabla messages -->
        <path d="M 584,168 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 3 · tabla → Realtime -->
        <path d="M 784,200 V 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- 4 · Realtime → hook (headline path) -->
        <path d="M 640,408 H 288" fill="none" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <!-- 5 · hook → UI -->
        <path d="M 180,376 V 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ===== NODES ===== -->
        <!-- N1 · UI (input treatment) -->
        <rect x="72" y="136" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="136" width="216" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="80" y="142" width="24" height="12" rx="2" fill="none" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="92" y="151" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
        <text x="180" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">messagesModule</text>
        <text x="180" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">components/messagesModule.tsx</text>

        <!-- N2 · server actions (backend treatment) -->
        <rect x="384" y="136" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="384" y="136" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="392" y="142" width="44" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="414" y="151" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ACTION</text>
        <text x="484" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">chat actions</text>
        <text x="484" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">features/chat/actions.ts</text>

        <!-- N3 · hook (focal treatment) -->
        <rect x="72" y="376" width="216" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="72" y="376" width="216" height="64" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <rect x="80" y="382" width="32" height="12" rx="2" fill="none" stroke="rgba(191,69,32,0.40)" stroke-width="0.8"/>
        <text x="96" y="391" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HOOK</text>
        <text x="180" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">useMessagesRealtime</text>
        <text x="180" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">features/chat/hooks/</text>

        <!-- N4 · tabla messages (store treatment) -->
        <rect x="680" y="136" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="136" width="208" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="688" y="142" width="36" height="12" rx="2" fill="none" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
        <text x="706" y="151" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">TABLE</text>
        <text x="784" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">messages</text>
        <text x="784" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">postgres · RLS SELECT</text>

        <!-- N5 · Supabase Realtime (external treatment) -->
        <rect x="680" y="376" width="208" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="376" width="208" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="688" y="382" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="712" y="391" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SERVICE</text>
        <text x="784" y="410" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Realtime</text>
        <text x="784" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">supabase-js · websocket</text>

        <!-- ===== ARROW LABELS (masked, after nodes; all in open canvas) ===== -->
        <rect x="314" y="150" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="336" y="159" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">INVOCA</text>

        <rect x="606" y="150" width="52" height="12" rx="2" fill="#f5f5f5"/>
        <text x="632" y="159" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PERSISTE</text>

        <rect x="792" y="282" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="824" y="291" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVENTO WAL</text>

        <rect x="438" y="390" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="472" y="399" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUSCRIPCIÓN</text>

        <rect x="92" y="282" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="132" y="291" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FUSIÓN POR ID</text>

        <!-- ===== LEGEND (bottom strip) ===== -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <line x1="140" y1="545" x2="172" y2="545" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <text x="180" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">FLUJO DE DATOS</text>
        <line x1="340" y1="545" x2="372" y2="545" stroke="#bf4520" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <text x="380" y="548" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">SUSCRIPCIÓN EN VIVO</text>
      </svg>
    </div>
  </div>
</body>
</html>
